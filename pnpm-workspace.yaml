packages:
  - .
  - examples/*
  - packages/*
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: false
# next 16.4.1 is a security release (GHSA-673q-mjm6-r5xr, GHSA-2464-fhr4-w9xw, GHSA-p3m5-59mp-jv5r),
# published on 2026-10-14, so it is younger than pnpm's one-day minimum release age. These exact versions
# are exempt so the fix lands now. The entries can go after 2026-10-15 17:44 UTC, when they are old enough.
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
# CI's audit job fails on a high or critical advisory in a production dependency (`pnpm audit --prod
# --audit-level=high`), and pnpm counts the examples' dependencies and the peers it installs as
# production. Both packages below come in through @docusaurus/core 3.10, which asks for a major that has
# no fixed release. Only this repository's install takes the overrides: a site that installs ondocs
# resolves its own Docusaurus.
overrides:
  # Critical GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr. Docusaurus builds a site of more than 100
  # pages in a tinypool worker pool.
  tinypool@<2.1.2: ^2.1.2
  # High GHSA-5c6j-r48x-rmvq and moderate GHSA-qj8w-gfj5-8c6v, through copy-webpack-plugin 11 and
  # css-minimizer-webpack-plugin 5. Their current majors ask for ^7.0.3.
  serialize-javascript@<7.0.5: ^7.0.5
# Advisories the audit skips, because no release this repository can take fixes them. Take an entry
# out once one does.
auditConfig:
  ignoreGhsas:
    # braces 3.0.3 and older: stack exhaustion on deeply nested brace patterns, with no fixed release.
    # Through micromatch, Docusaurus and webpack expand the build's own glob patterns with it.
    - GHSA-vfj7-8cjw-p6xm
    # vite 6.4.2 and older: a server.fs.deny bypass in the dev server, on Windows. VitePress 1 needs
    # vite 5, and no vite 5 release fixes it. CI and Vercel only build the VitePress example, on Linux.
    - GHSA-fx2h-pf6j-xcff
