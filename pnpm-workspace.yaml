packages:
  - .
  - examples/*
  - packages/*
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: false
# CI's audit job fails on a high or critical advisory in a production dependency (`pnpm audit --prod
# --audit-level=high`), and pnpm counts the examples' dependencies and the peers it installs as
# production. tinypool and serialize-javascript come in through @docusaurus/core 3.10, and vite through
# VitePress 1: each asks for a major that has no fixed release. postcss-selector-parser and uuid are
# moderate, so they pass the audit job, but each is an open Dependabot alert. Only this repository's
# install takes the overrides: a site that installs ondocs resolves its own Docusaurus, Starlight and
# VitePress.
overrides:
  # High GHSA-27r3-jxmh-p828: trailing bytes after a compressed request body, in body-parser 1, which
  # express 4 asks for through Docusaurus's dev server (@docusaurus/core > webpack-dev-server).
  body-parser@<1.20.9: ^1.20.9
  # Critical GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr. Docusaurus builds a site of more than 100
  # pages in a tinypool worker pool.
  tinypool@<2.1.2: ^2.1.2
  # High GHSA-5c6j-r48x-rmvq and moderate GHSA-qj8w-gfj5-8c6v, through copy-webpack-plugin 11 and
  # css-minimizer-webpack-plugin 5. Their current majors ask for ^7.0.3.
  serialize-javascript@<7.0.5: ^7.0.5
  # High GHSA-587h-7wmj-h5pm and GHSA-fx2h-pf6j-xcff, in the dev server on Windows. VitePress 1.6.4,
  # its latest release, asks for vite ^5.4.14, no vite 5 release fixes them, and VitePress 2 is still
  # an alpha. Its @vitejs/plugin-vue 5 accepts vite 6, and the VitePress example builds with it.
  vitepress>vite: ^6.4.4
  # Moderate GHSA-rj75-hqrm-r3gf: a long flat selector such as .a.a.a... parses in quadratic time.
  # cssnano 6, which @docusaurus/bundler 3.10 asks for, and postcss-nested 6, through Starlight's
  # Expressive Code 0.44.2, ask for ^6. 6.1.5 backports the fix, but the advisory still lists every
  # version below 7.1.6. 7.0's one breaking change makes insertions during iteration safe. With it,
  # cssnano 6 and postcss-nested 6 give the same output on the examples' CSS, and the Docusaurus and
  # Starlight examples build the same files. Take it out once the advisory lists 6.1.5, or once
  # Docusaurus asks for cssnano 7 (Expressive Code 0.44.3 already asks for postcss-nested 7).
  postcss-selector-parser@<7.1.6: ^7.1.6
  # Moderate GHSA-w5hq-g745-h8pq, through sockjs 0.3.24 in webpack-dev-server 5, the Docusaurus dev
  # server. sockjs 0.3.24 is its latest release and asks for uuid ^8.3.2. It only calls v4(), which
  # uuid 11 still exports from its CommonJS build.
  sockjs>uuid: ^11.1.1
# Advisories the audit skips, because no release this repository can take fixes them. Take an entry
# out once one does.
auditConfig:
  ignoreGhsas:
    # braces 3.0.3 and older: stack exhaustion on deeply nested brace patterns, with no fixed release.
    # Through micromatch, Docusaurus and webpack expand the build's own glob patterns with it.
    - GHSA-vfj7-8cjw-p6xm
