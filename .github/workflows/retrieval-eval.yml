name: Retrieval eval

# Retrieval on docusaurus.io's docs with OpenAI's embeddings, which CI's keyword-only eval cannot
# measure without a key: scripts/retrieval-eval.mjs indexes the docs at the commit
# scripts/corpus.mjs pins with text-embedding-3-small at 512 dimensions, runs `ondocs eval` on
# test/eval/docusaurus.io.yaml at minSimilarity 0.15 to 0.40, and writes the report to the run's
# summary and an artifact. On demand only, with the OPENAI_API_KEY repository secret: it never
# runs on a push or a pull request.
#
# Cost: before it embeds anything, the run counts the chunks with a keyword-only build and stops
# if there are more than MAX_CHUNKS. The pinned docs are 1,070 chunks of at most 1,200 characters,
# about 716,000 characters with their page titles and headings, and fewer tokens than characters.
# A failed batch is tried at most three times, and the 28 questions are embedded once per gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-eval
  cancel-in-progress: false

jobs:
  eval:
    name: docusaurus.io's docs, text-embedding-3-small at 512 dimensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_CHUNKS: 1500
    steps:
      - name: Check that the OpenAI key is set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=No OPENAI_API_KEY secret::This workflow embeds with OpenAI. Add an OPENAI_API_KEY repository secret (Settings, Secrets and variables, Actions), then run it again."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Fetch docusaurus.io's docs at the pinned commit
        run: node scripts/corpus.mjs
      # The key goes to this step only, not to the install or the build.
      - name: Index with text-embedding-3-small and score it
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/retrieval-eval.mjs --out "$RUNNER_TEMP/retrieval-eval" --max-chunks "$MAX_CHUNKS"
      - name: Write the report to the run's summary
        run: cat "$RUNNER_TEMP/retrieval-eval/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report, the index and the questions as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval
          path: |
            ${{ runner.temp }}/retrieval-eval/report.json
            ${{ runner.temp }}/retrieval-eval/report.md
            ${{ runner.temp }}/retrieval-eval/ask-index.json
            ${{ runner.temp }}/retrieval-eval/questions-*.yaml
          if-no-files-found: error
          retention-days: 90
