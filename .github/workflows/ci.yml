name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the release workflow on its release pull request, which its own pushes can't trigger.
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an older one on a pull request's branch, and on the release pull request's,
# whose runs release.yml starts with workflow_dispatch. Pushes to main are never cancelled, so each
# merge commit gets a full result. They also get a group each: in a shared group, a run still
# waiting its turn gives way to the next one, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # docusaurus.io's, Astro's and Vitest's docs at pinned commits, which test/corpus.test.ts,
      # test/eval/real-questions.test.ts and the real-question evals below search.
      - name: Fetch the real-world docs corpus
        run: node scripts/corpus.mjs
      - run: pnpm test
      - run: pnpm build
      - name: Check the published packages, ondocs and packages/ (publint, are-the-types-wrong)
        run: pnpm check:package
      - name: Check the script embed's size (the launcher, and the dialog it loads), and that the docs give it
        run: node scripts/embed-size.mjs
      - name: The Docusaurus and Starlight docs match the website's
        run: pnpm examples:check
      - name: The Cloudflare Worker template is what ondocs init writes
        run: pnpm template:check
      - name: CLI smoke test, including --check and --llms-txt
        run: |
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --llms-txt "$RUNNER_TEMP/llms"
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --check
          test -s "$RUNNER_TEMP/llms/llms.txt" && test -s "$RUNNER_TEMP/llms/llms-full.txt" && test -s "$RUNNER_TEMP/llms/docs/mcp.md"
      # retrieval-eval.yml runs this with OpenAI, by hand; here the local stub answers, with no key.
      - name: The retrieval eval's steps, against the local OpenAI stub
        run: node scripts/retrieval-eval.mjs --stub --out "$RUNNER_TEMP/retrieval-eval"
      - name: Build the example app (mock mode, no API key); each docs page links its .md copy
        run: |
          # Re-link the workspace now that dist/cli.js exists, so the example gets its bin.
          pnpm install --frozen-lockfile --offline
          pnpm --filter ondocs-example-nextjs build
          test -s examples/nextjs/public/docs/mcp.md
          grep -Eq '<link rel="alternate" type="text/markdown" href="[^"]*/docs/mcp\.md"' examples/nextjs/.next/server/app/docs/mcp.html
      - name: Score the website's retrieval with ondocs eval
        run: node dist/cli.js eval examples/nextjs/ask-eval.yaml
      # Questions people asked on Stack Overflow, with the pages the accepted answers link
      # (test/eval/README.md), keyword-only with no key: each file's thresholds sit just under
      # today's scores, so a change that loses one fails here.
      - name: Score real Stack Overflow questions about Docusaurus, Astro and Vitest, keyword-only
        run: |
          node dist/cli.js index .corpus/docusaurus/website/docs --framework docusaurus --base-url /docs -e none -o "$RUNNER_TEMP/docusaurus.json" -q
          node dist/cli.js eval test/eval/docusaurus-title.yaml --index "$RUNNER_TEMP/docusaurus.json"
          node dist/cli.js index .corpus/astro/src/content/docs/en --framework starlight --base-url /en -e none -o "$RUNNER_TEMP/astro.json" -q
          node dist/cli.js eval test/eval/astro-title.yaml --index "$RUNNER_TEMP/astro.json"
          node dist/cli.js index .corpus/vitest/docs --framework none --base-url / --ignore 'guide/examples/**' --ignore guide/cli-generated.md --ignore AGENTS.md -e none -o "$RUNNER_TEMP/vitest.json" -q
          node dist/cli.js eval test/eval/vitest-title.yaml --index "$RUNNER_TEMP/vitest.json"
      - name: Lint the example app
        run: pnpm --filter ondocs-example-nextjs lint
      # The three examples are the live demos on Vercel: each is built as its vercel.json says,
      # after the install from the repository root that this job ran, and with no key.
      - name: Build the Docusaurus example as Vercel builds its live demo; the plugin must write its index and llms files, and link each page's .md copy
        run: |
          (cd examples/docusaurus && sh -c "$(node -p "require('./vercel.json').buildCommand")")
          test -s "examples/docusaurus/$(node -p "require('./examples/docusaurus/vercel.json').outputDirectory")/index.html"
          grep -rq 'https://ondocs.vercel.app/api/ask' examples/docusaurus/build/assets/js
          node -e "const i=JSON.parse(require('fs').readFileSync('examples/docusaurus/build/ask-index.json','utf8'));if(i.documents.length<5)throw new Error('only '+i.documents.length+' pages indexed');console.log(i.documents.length,'pages,',i.chunks.length,'chunks')"
          grep -q '<link rel="alternate" type="text/markdown" href="/mcp.md"></head>' examples/docusaurus/build/mcp/index.html
          test -s examples/docusaurus/build/llms.txt && test -s examples/docusaurus/build/llms-full.txt && test -s examples/docusaurus/build/mcp.md
      - name: Build the Starlight example as Vercel builds its live demo; the plugin must write its index and llms files, and link each page's .md copy, without pagefind:false pages
        run: |
          (cd examples/starlight && sh -c "$(node -p "require('./vercel.json').buildCommand")")
          test -s "examples/starlight/$(node -p "require('./examples/starlight/vercel.json').outputDirectory")/index.html"
          grep -rq 'https://ondocs.vercel.app/api/ask' examples/starlight/dist/_astro
          node -e "const i=JSON.parse(require('fs').readFileSync('examples/starlight/dist/ask-index.json','utf8'));if(i.documents.length<5)throw new Error('only '+i.documents.length+' pages indexed');if(i.documents.some(d=>d.url.startsWith('/changelog')))throw new Error('indexed the pagefind: false changelog');console.log(i.documents.length,'pages,',i.chunks.length,'chunks')"
          grep -q '<link rel="alternate" type="text/markdown" href="/integrations/mcp.md"></head>' examples/starlight/dist/integrations/mcp/index.html
          if grep -q 'href="/changelog.md"' examples/starlight/dist/changelog/index.html; then echo 'The pagefind: false changelog links a .md copy'; exit 1; fi
          test -s examples/starlight/dist/llms.txt && test -s examples/starlight/dist/llms-full.txt && test -s examples/starlight/dist/integrations/mcp.md && test ! -e examples/starlight/dist/changelog.md
      - name: Build the VitePress example as Vercel builds its live demo; the plugin must write its index and llms files, and link each page's .md copy
        run: |
          (cd examples/vitepress && sh -c "$(node -p "require('./vercel.json').buildCommand")")
          test -s "examples/vitepress/$(node -p "require('./examples/vitepress/vercel.json').outputDirectory")/index.html"
          grep -rq 'https://ondocs.vercel.app/api/ask' examples/vitepress/.vitepress/dist/assets
          node -e "const i=JSON.parse(require('fs').readFileSync('examples/vitepress/.vitepress/dist/ask-index.json','utf8'));if(i.documents.length<5)throw new Error('only '+i.documents.length+' pages indexed');console.log(i.documents.length,'pages,',i.chunks.length,'chunks')"
          grep -q '<link rel="alternate" type="text/markdown" href="/vitepress.md"></head>' examples/vitepress/.vitepress/dist/vitepress.html
          test -s examples/vitepress/.vitepress/dist/llms.txt && test -s examples/vitepress/.vitepress/dist/llms-full.txt && test -s examples/vitepress/.vitepress/dist/vitepress.md

      # Each docs page in headless Chrome: the JavaScript it loads before any interaction, within
      # each site's budget, and the dialog opening from a shortcut pressed while its code loads,
      # with focus in its input and back where it was on close.
      - name: Install headless Chrome
        run: pnpm exec playwright-core install --with-deps --only-shell chromium
      - name: JavaScript per page and the dialog's focus, in a browser
        run: node scripts/js-weight.mjs docusaurus starlight vitepress next embed --check
      # A question asked on each demo and on the script tag's page, as a visitor asks it, with a
      # handler in the script answering: the answer's citations and sources, axe on the dialog in
      # the light and dark schemes, and Enter on a citation opening the cited section.
      - name: Ask a question on each demo in a browser, and open a citation with Enter
        run: node scripts/browser-ask.mjs docusaurus starlight vitepress embed
      - name: Every page of the website fits a 390px screen, without scrolling sideways
        run: node scripts/mobile-width.mjs

  # A site made the way a new user makes one, with the scaffolder's defaults, and ondocs
  # installed from the packed tarball rather than linked from the workspace. The index is built
  # with OpenAI embeddings from a local stub (scripts/openai-stub.mjs) and must come out embedded.
  # The sites are generated rather than committed: scaffolding takes seconds next to installing,
  # and a committed copy would drift from what create-docusaurus and friends produce today.
  # Nextra has no scaffolder, so its site is the docs starter from the Nextra repository at a
  # pinned tag. The Fumadocs and Nextra sites' index must have every docs page next build
  # generated, and nothing else.
  #
  # Each site installs with npm and the latest of its framework. Five more runs install with pnpm,
  # which gives a site only its direct dependencies where npm hoists the rest (starlight-ondocs
  # alone must stop the build and say to install ondocs), or on the oldest Docusaurus, React,
  # Astro and Starlight the peer ranges allow.
  consumers:
    name: Fresh ${{ matrix.site }} site, from the packed package${{ matrix.variant && format(', {0}', matrix.variant) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The last two install the plugin under its own package's name, from packages/.
        site:
          - next
          - fumadocs
          - nextra
          - docusaurus
          - starlight
          - vitepress
          - docusaurus-plugin-ondocs
          - starlight-ondocs
        variant: ['']
        include:
          - site: starlight
            variant: with pnpm
            flags: --pm=pnpm
          - site: starlight-ondocs
            variant: with pnpm
            flags: --pm=pnpm
          - site: docusaurus-plugin-ondocs
            variant: with pnpm
            flags: --pm=pnpm
          - site: docusaurus
            variant: on the oldest peers
            flags: --oldest-peers
          - site: starlight
            variant: on the oldest peers
            flags: --oldest-peers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The scaffolders and the sites' dependencies, cached for a week at a time, so the cache
      # follows the templates as they change without saving a new copy on every run.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: consumer-${{ matrix.site }}${{ matrix.flags }}-${{ steps.week.outputs.week }}
          restore-keys: consumer-${{ matrix.site }}${{ matrix.flags }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create, build and check the site
        run: node scripts/consumer-site.mjs ${{ matrix.site }} "$RUNNER_TEMP"/ondocs-*.tgz "$RUNNER_TEMP/site" ${{ matrix.flags }}

  # What `ondocs init` writes for each host, built with that host's own tooling (vercel build,
  # netlify build --offline and serve, wrangler --dry-run and local dev), signed in to nothing, then
  # asked questions against a local OpenAI stub. The astro-* recipes have no route file: the
  # integration serves the endpoints through the adapter. workers-ai runs the Cloudflare Worker
  # template's own tests in workerd, with stand-ins for the site and the AI binding.
  recipes:
    name: Deploy recipe, ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - vercel
          - netlify
          - cloudflare-pages
          - cloudflare-workers
          - github-pages
          - workers-ai
          - astro-node
          - astro-vercel
          - astro-cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The host CLIs and the sites' dependencies, cached for a week at a time, as for consumers.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: recipe-${{ matrix.recipe }}-${{ steps.week.outputs.week }}
          restore-keys: recipe-${{ matrix.recipe }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Write, build and ask the endpoint
        run: node scripts/deploy-recipes.mjs ${{ matrix.recipe }} "$RUNNER_TEMP"/ondocs-*.tgz "$RUNNER_TEMP/site"

  # The oldest Node.js the engines field allows, 22.13.0, and the newest, 26: the tests and the
  # built CLI on each. The tooling runs on 24, as it needs a newer 22 (tsdown asks for 22.18), so
  # the job installs and builds there, then switches. On 22.13.0 the tests that run in jsdom are
  # left out: jsdom 30 asks for Node 22.22, and what they test, the dialog, runs in a browser, not
  # on Node.js. The floor is 22.13 rather than 22.12, where require() of an ES module warns that it
  # is experimental, and one that throws as it loads also rejects, unhandled, ending the process.
  node-compat:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm's own executable, which runs whichever Node.js is set up, as the tests call pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/corpus.mjs
      - run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: The tests, on Node ${{ matrix.node }}
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          node --version | grep "^v$NODE_VERSION"
          if [ "$NODE_VERSION" = 22.13.0 ]; then
            node node_modules/vitest/vitest.mjs run $(git grep -l -e '@vitest-environment jsdom' -- test | sed 's/^/--exclude=/')
          else
            pnpm test
          fi
      - name: CLI smoke test, on Node ${{ matrix.node }}
        run: |
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --llms-txt "$RUNNER_TEMP/llms"
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --check
          test -s "$RUNNER_TEMP/llms/llms.txt" && test -s "$RUNNER_TEMP/llms/docs/mcp.md"

  # Windows, where many Docusaurus and Starlight sites are built: the tests, and a fresh
  # Docusaurus site from the packed package, as the consumers job builds one. Paths there have
  # backslashes, which the plugins turn into URLs (src/node/index.ts, src/integration/llms.ts).
  windows:
    name: Test on Windows, and build a fresh Docusaurus site there
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks text files out with CRLF line ends; the tests and the
      # repository's files expect LF, as on every other runner.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/corpus.mjs
      # Every test file but these, which fail on Windows for reasons of their own: they compare
      # paths, file lists or messages with `/` where Windows gives `\` (astro, cli, dev,
      # framework-guides, init, readme-claims, runtime-neutral, website, eval/real-questions),
      # spawn npm or pnpm without a shell, which Windows needs for their .cmd files (npm-readme,
      # plugin-packages), or put POSIX shell stand-ins on PATH (release-workflow). Each one that
      # is made to pass leaves this list.
      - name: The tests, but those that assume POSIX paths and tools
        run: >-
          pnpm test
          --exclude test/astro.test.ts
          --exclude test/cli.test.ts
          --exclude test/dev.test.ts
          --exclude test/eval/real-questions.test.ts
          --exclude test/framework-guides.test.ts
          --exclude test/init.test.ts
          --exclude test/npm-readme.test.ts
          --exclude test/plugin-packages.test.ts
          --exclude test/readme-claims.test.ts
          --exclude test/release-workflow.test.ts
          --exclude test/runtime-neutral.test.ts
          --exclude test/website.test.tsx
      - run: pnpm build
      - run: npm pack
      - name: Create, build and check a fresh Docusaurus site
        run: node scripts/consumer-site.mjs docusaurus ondocs-*.tgz "$RUNNER_TEMP/site"

  # The endpoint on Bun and on Deno, which Getting started says it runs on: the built handler,
  # served by Bun.serve and Deno.serve as the docs show, asked a question over HTTP with the mock
  # models (scripts/runtime-smoke.mjs). Deno also asks for the hostname to be allowed, which the
  # AI SDK reads as it loads.
  runtimes:
    name: The endpoint on Bun and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The newest patch of a pinned minor, so a new minor of either runtime is a change here
      # rather than a red required job on an unrelated pull request.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.x
      - name: Index the website's docs with the mock model
        run: node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json"
      - name: Ask the endpoint on Bun
        run: bun --version && bun scripts/runtime-smoke.mjs "$RUNNER_TEMP/ask-index.json"
      - name: Ask the endpoint on Deno
        run: deno --version && deno run --allow-read --allow-net --allow-env --allow-sys=hostname scripts/runtime-smoke.mjs "$RUNNER_TEMP/ask-index.json"

  # The tests with coverage of src/ (vitest.config.ts), which fail under its thresholds. The
  # robustness tests run without their time budget there: coverage slows code by how much depends
  # on the code. The verify job keeps the budget.
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/corpus.mjs
      - name: The tests with coverage, against the thresholds
        run: pnpm test:coverage

  # The oldest ai 7 the peer range allows, over the lockfile's: a site that already has an older
  # ai 7 keeps it when it installs ondocs, while the jobs above run the lockfile's ai and the fresh
  # sites the latest. ai 7.0.0 to 7.0.50 crashed the Docusaurus plugin's load under jiti, and
  # before 7.0.92 the endpoint's onAbort had no reason. test/ai-peer-floor.test.ts keeps the ai
  # version here at the peer range's floor for 7, and ai-sdk-6's at its floor for 6.
  ai-floor:
    name: Typecheck and test on the oldest ai 7 the peer range allows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The AI SDK's packages depend on each other at exact versions, so @ai-sdk/openai is one
      # released with this ai, on the same @ai-sdk/provider. A newer one brings a second copy of
      # the provider's types, which the typecheck rejects.
      - name: Install ai at the peer range's floor for 7, and an @ai-sdk/openai released with it
        run: pnpm add -D -w ai@7.0.95 @ai-sdk/openai@4.0.63 --ignore-scripts
      - run: pnpm typecheck
      - run: node scripts/corpus.mjs
      - run: pnpm test

  # AI SDK 6, which the peer range allows too: the package as it is published, built with the
  # lockfile's AI SDK 7, then run on the newest AI SDK 6 and on the oldest the range allows, 6.0.16,
  # the first whose timeout takes { totalMs }. Each comes with an @ai-sdk/openai 3 on the same
  # @ai-sdk/provider. On each: the tests, but those that make models of their own with AI SDK 7's
  # test classes or its v4 specification, the API report, which prints AI SDK 7's types, and the
  # first-word timeout, which AI SDK 6 does not have; then the built CLI, which loads the endpoint
  # and the mock models in Node.js as a site does, and a question to the built endpoint, on Bun.
  # The source is typechecked against AI SDK 7 only.
  ai-sdk-6:
    name: Test on AI SDK 6, the newest and the oldest the peer range allows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Newest first: once 6.0.16 is installed, `pnpm add ai@^6` keeps it, as it satisfies ^6.
      - name: The tests, the CLI and the endpoint on the newest AI SDK 6, then on 6.0.16
        run: |
          for versions in 'ai@^6 @ai-sdk/openai@^3' 'ai@6.0.16 @ai-sdk/openai@3.0.7'; do
            pnpm add -D -w $versions --ignore-scripts
            node -p "'ai ' + require('ai/package.json').version + ', @ai-sdk/openai ' + require('@ai-sdk/openai/package.json').version"
            pnpm test --exclude=test/api-report.test.ts -t '^(?!.*first-word limit)' \
              $(git grep -l -E "Mock[A-Za-z]+ModelV4|specificationVersion: 'v4'" -- 'test/*.ts' 'test/*.tsx' | sed 's/^/--exclude=/')
            node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json"
            bun scripts/runtime-smoke.mjs "$RUNNER_TEMP/ask-index.json"
          done

  # Known advisories in the locked dependencies. pnpm audit reads pnpm-lock.yaml and asks the npm
  # registry, with no install. A high or critical advisory in a production dependency fails the job,
  # and pnpm counts the examples' dependencies (the live demos) and the peers it installs as
  # production. pnpm-workspace.yaml holds the overrides that keep it passing and the advisories it
  # skips, each with its reason. Every advisory, dev dependencies included, goes to the run's summary.
  audit:
    name: Audit the dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Every advisory in the lockfile, to the run's summary (a report, which fails nothing)
        run: |
          {
            echo '### pnpm audit, all dependencies'
            echo '```'
            pnpm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: No high or critical advisory in a production dependency
        run: pnpm audit --prod --audit-level=high

  # The check main's ruleset requires, by this name. It needs every other job, so a merge waits for
  # all of them (test/ci-workflow.test.ts fails when a job is missing from the list). A required
  # check that is skipped counts as passed, and a job is skipped when one it needs fails, so this
  # one runs always() and fails unless every job it needs succeeded.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - verify
      - consumers
      - recipes
      - node-compat
      - windows
      - runtimes
      - coverage
      - ai-floor
      - ai-sdk-6
      - audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One line per job, then an error that names each job that did not succeed.
      - name: Every job it needs succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed=$(jq -r 'to_entries | map(select(.value.result != "success") | "\(.key) (\(.value.result))") | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Did not succeed: $failed. Open each one's log, then fix it or re-run it."
            exit 1
          fi
          # An empty list of results fails too.
          jq -e 'length > 0' <<< "$NEEDS" > /dev/null
