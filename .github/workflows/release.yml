name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # the version commit, tags and GitHub releases
  pull-requests: write # the release pull request
  id-token: write # npm trusted publishing, with provenance
  actions: write # starting CI on the release pull request

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url and no token: npm trusted publishing authenticates this workflow with
      # OIDC, so there is no secret to leak or rotate. Each published package trusts this
      # repository's release.yml (`npm trust github <name> --repo dgesteves/ondocs
      # --file release.yml --allow-publish`, for ondocs, docusaurus-plugin-ondocs and
      # starlight-ondocs); provenance also checks that each package.json's `repository` is the
      # repository this runs in. `changeset publish` publishes every workspace package that isn't
      # private and whose version isn't on npm yet: ondocs first, then the two in packages/,
      # which depend on it at the same version.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docusaurus.io's own docs at a pinned commit, which test/corpus.test.ts searches (as in ci.yml).
      - name: Fetch the real-world docs corpus
        run: node scripts/corpus.mjs
      - run: pnpm validate
      # With pending changesets this opens or updates the release pull request. Once that is
      # merged, it publishes to npm and creates the GitHub release.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          # sync-template moves the Worker template to the version this release publishes.
          version-script: pnpm changeset version && node scripts/sync-template.mjs
          publish-script: pnpm release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
      # The release pull request is pushed with this workflow's token, and pushes made with it
      # start no workflows, so start CI on it here: main only accepts pull requests that pass.
      - name: Run CI on the release pull request
        if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
