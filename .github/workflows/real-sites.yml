name: Real sites

# The packed package in real docs sites, at pinned commits, each with its own package manager and
# workspace: Starlight's docs (pnpm, 17 locales), Vitest's (pnpm, VitePress 2), typescript-eslint's
# (pnpm, built by nx) and Jest's (Yarn 4, versioned docs). scripts/real-sites.mjs installs, builds
# and checks each: an index per locale, every anchor on its page, `npx ondocs`, and a question's
# sources. Each run clones another project and runs its build, so this is not part of ci.yml and
# ci-ok does not wait for it: it runs by hand, every Monday, and on a pull request that changes it.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - .github/workflows/real-sites.yml
      - scripts/real-sites.mjs

permissions:
  contents: read

concurrency:
  group: real-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Real ${{ matrix.site }} site, from the packed package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: [starlight, vitest, typescript-eslint, jest]
    steps:
      # No token in the checkout's git config, where the other project's build could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The site's packages, in pnpm's store or Yarn's cache, kept a week at a time.
      - id: cache
        run: |
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache.outputs.store }}
            ~/.yarn/berry/cache
          key: real-${{ matrix.site }}-${{ steps.cache.outputs.week }}
          restore-keys: real-${{ matrix.site }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install, build and check the site
        run: node scripts/real-sites.mjs ${{ matrix.site }} "$RUNNER_TEMP"/ondocs-*.tgz "$RUNNER_TEMP/site"
