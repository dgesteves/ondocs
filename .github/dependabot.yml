version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Raise a range in package.json only when it no longer allows the new version, and otherwise
    # update the lockfile alone. Without this, a minor release of a dialog peer raised ondocs's
    # published peer range with the devDependency (@radix-ui/react-dialog ^1.1.23 to ^1.2.0 in
    # #127), which moves every site's minimum for nothing ondocs uses, and leaves the plugin
    # packages' ranges behind (test/plugin-packages.test.ts).
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
    ignore:
      # TypeScript 7 is the Go compiler, which typescript-eslint doesn't support yet. Move to it by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major the code runs and is tested on (24), not the newest one:
      # newer types would let code use APIs that Node 24 doesn't have. Move it with .nvmrc and CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jiti stays at the version Docusaurus loads plugins with (1.21.7 in Docusaurus 3.10), so
      # test/embedding.test.ts reproduces how the plugin is really loaded. Move it with Docusaurus.
      - dependency-name: jiti
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
